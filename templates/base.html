<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ institution }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner reveal">
      <p class="kicker">Student Documentaions · {{ academic_year }}</p>
      <a class="brand" href="{{ url_for('form') }}">{{ institution }}</a>
    </div>
  </header>
  <main class="wrap">
    {% block main %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap reveal">
      <p>Powered by Rehnova Digitals</p>
    </div>
  </footer>
</body>
</html>
