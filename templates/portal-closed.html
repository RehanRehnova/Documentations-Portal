<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Portal closed</title>
<style>
  :root {
    --wall: #e9edf0;
    --slat: #a3b3bf;
    --slat-line: #8a9ba8;
    --rail: #5b6b78;
    --ink: #1d2630;
    --muted: #51606d;
    --link: #0f5c7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #161c22;
      --slat: #3b4853;
      --slat-line: #2b363f;
      --rail: #596874;
      --ink: #e8edf1;
      --muted: #9aa8b4;
      --link: #7cc4e3;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--wall);
    color: var(--ink);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Roller shutter: slats with a bottom rail and a pull slot */
  .shutter {
    position: relative;
    height: clamp(11rem, 38vh, 20rem);
    background:
      linear-gradient(var(--rail), var(--rail)) bottom / 100% 1rem no-repeat,
      repeating-linear-gradient(var(--slat) 0 1.1rem, var(--slat-line) 1.1rem 1.35rem);
  }
  .shutter::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: .25rem;
    width: 4.5rem;
    height: .5rem;
    margin-left: -2.25rem;
    border-radius: 1rem;
    background: var(--wall);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 36rem;
    margin: 0 auto;
    padding: clamp(2rem, 7vh, 4rem) 1.5rem 3rem;
    text-align: center;
  }

  h1 {
    margin: 0 0 1rem;
    font-family: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: clamp(2.25rem, 8vw, 4rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  p { margin: 0 0 .75rem; color: var(--muted); }

  a { color: var(--link); text-underline-offset: .2em; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="shutter" aria-hidden="true"></div>

  <!-- Edit the wording and contact address below to fit your portal -->
  <main>
    <h1>This portal is now closed.</h1>
    <p>Sign-in and submissions are no longer available.</p>
    <p>If you have a question, email <a href="mailto:support@example.com">support@example.com</a>.</p>
  </main>
</body>
</html>
